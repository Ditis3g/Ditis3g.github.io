몸통 IMU 완제품</text><text x="65" y="449" fill="#536c80" font-size="17">몸통에 단단히 고정</text><text x="65" y="474" fill="#536c80" font-size="17">3.3V · GND · SDA · SCL</text><text x="65" y="499" fill="#536c80" font-size="17">제조사·모델명 비기재</text><path d="M345 430H440" fill="none" stroke="#008775" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><rect x="348" y="387" width="90" height="27" rx="5" fill="white"/><text x="355" y="406" fill="#008775" font-size="16" font-weight="700">J7</text><text x="50" y="575" fill="#008775" font-size="17">목 관절 가동 여유 확보</text><text x="50" y="602" fill="#008775" font-size="17">모터 전원선과 떨어뜨려 배선</text><rect x="1030" y="345" width="325" height="115" rx="14" fill="#f4f8fd" stroke="#008775" stroke-width="1.6"/><text x="1050" y="379" fill="#183148" font-size="21" font-weight="700">ToF 거리 센서</text><text x="1050" y="409" fill="#536c80" font-size="17">J5 / I²C + 3.3V</text><text x="1050" y="434" fill="#536c80" font-size="17">몸통 IMU와 다른 포트</text><path d="M880 400H1030" fill="none" stroke="#008775" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="918" y="363" width="90" height="27" rx="5" fill="white"/><text x="925" y="382" fill="#008775" font-size="16" font-weight="700">J5</text><rect x="1030" y="505" width="325" height="115" rx="14" fill="#f4f8fd" stroke="#7c51ac" stroke-width="1.6"/><text x="1050" y="539" fill="#183148" font-size="21" font-weight="700">스피커</text><text x="1050" y="569" fill="#536c80" font-size="17">J1 2핀 / 앰프 출력</text><text x="1050" y="594" fill="#536c80" font-size="17">두 선 모두 스피커에 연결</text><path d="M880 535H1030" fill="none" stroke="#7c51ac" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-audio)"/><rect x="918" y="498" width="90" height="27" rx="5" fill="white"/><text x="925" y="517" fill="#7c51ac" font-size="16" font-weight="700">J1</text><text x="460" y="606" fill="#2468b4" font-size="19" font-weight="700">TTL DATA + 공통 GND</text><path d="M660 570V680M230 680H1170