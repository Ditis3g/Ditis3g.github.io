<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1080" role="img" aria-labelledby="title desc"><title id="title">02  배터리 · HAT · 서보 전원 분리</title><desc id="desc">기존 XL330-M288-T ×15 기준 / HAT에는 배터리 전압, 서보에는 별도 5.0V</desc><defs><marker id="a-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2468b4"/></marker><marker id="a-imu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#008775"/></marker><marker id="a-raw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c34b35"/></marker><marker id="a-five" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#d08018"/></marker><marker id="a-gnd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#465769"/></marker><marker id="a-audio" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c51ac"/></marker><marker id="a-three" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#d64b58"/></marker></defs><style>text{font-family:"Malgun Gothic","Noto Sans KR",Arial,sans-serif} .t{font-size:21px;font-weight:700} .s{font-size:17px} .m{font-size:16px} .p{font-size:18px;font-weight:700}</style><rect width="1400" height="1080" fill="white"/><text x="42" y="48" fill="#183148" font-size="30" font-weight="700">02  배터리 · HAT · 서보 전원 분리</text><text x="42" y="80" fill="#536c80" font-size="17">기존 XL330-M288-T ×15 기준 / HAT에는 배터리 전압, 서보에는 별도 5.0V</text><rect x="45" y="130" width="285" height="145" rx="14" fill="#fff2ed" stroke="#c34b35" stroke-width="1.6"/><text x="65" y="164" fill="#183148" font-size="21" font-weight="700">2S 배터리 팩</text><text x="65" y="194" fill="#536c80" font-size="17">NP-F550 계열 기존 설계 기준</text><text x="65" y="219" fill="#536c80" font-size="17">공칭 7.2V / 만충 8.4V</text><text x="65" y="244" fill="#536c80" font-size="17">접점 극성·허용 전류 확인</text><rect x="420" y="130" width="370" height="145" rx="14" fill="#fff5e7" stroke="#c34b35" stroke-width="1.6"/><text x="440" y="164" fill="#183148" font-size="21" font-weight="700">보호·차단·분배</text><text x="440" y="194" fill="#536c80" font-size="17">F0 주퓨즈 → S0 주전원 스위치</text><text x="440" y="219" fill="#536c80" font-size="17">역극성 보호 / 접지 분배</text><text x="440" y="244" fill="#536c80" font-size="17">퓨즈·배선·스위치 정격은 실측 선정</text><path d="M330 180H420" fill="none" stroke="#c34b35" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-raw)"/><rect x="334" y="142" width="90" height="27" rx="5" fill="white"/><text x="341" y="161" fill="#c34b35" font-size="16" font-weight="700">BAT +</text><path d="M790 180H860V150H940" fill="none" stroke="#c34b35" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-raw)"/><circle cx="860" cy="180" r="6" fill="#c34b35"/><rect x="788" y="109" width="90" height="27" rx="5" fill="white"/><text x="795" y="128" fill="#c34b35" font-size="16" font-weight="700">F_HAT</text><rect x="940" y="110" width="415" height="150" rx="14" fill="#fff2ed" stroke="#c34b35" stroke-width="1.6"/><text x="960" y="144" fill="#183148" font-size="21" font-weight="700">HAT 전원 입력</text><text x="960" y="174" fill="#536c80" font-size="17">예: J11-2 = +BATT / J11-1 = GND</text><text x="960" y="199" fill="#536c80" font-size="17">전원 전용 하네스 / J11-3·4 미연결</text><text x="960" y="224" fill="#536c80" font-size="17">J3·J11은 RS-485 포트: TTL 모터용 아님</text><path d="M1145 260V310" fill="none" stroke="#c34b35" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-raw)"/><rect x="940" y="310" width="415" height="130" rx="14" fill="#fff7e9" stroke="#d08018" stroke-width="1.6"/><text x="960" y="344" fill="#183148" font-size="21" font-weight="700">HAT 내부 5V 전원 회로</text><text x="960" y="374" fill="#536c80" font-size="17">AP63205 강압 → 역류 방지 경로</text><text x="960" y="399" fill="#536c80" font-size="17">J4의 2·4번 = 컴퓨터용 +5V</text><text x="960" y="424" fill="#536c80" font-size="17">이 출력으로 서보 15개를 급전하지 않음</text><path d="M1145 440V485" fill="none" stroke="#d08018" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-five)"/><rect x="940" y="485" width="415" height="130" rx="14" fill="#f4f8fd" stroke="#2468b4" stroke-width="1.6"/><text x="960" y="519" fill="#183148" font-size="21" font-weight="700">Radxa Zero 3W</text><text x="960" y="549" fill="#536c80" font-size="17">40핀 헤더의 5V 입력으로 급전</text><text x="960" y="574" fill="#536c80" font-size="17">3.3V 레일은 헤더 1·17번으로 HAT 공유</text><text x="960" y="599" fill="#536c80" font-size="17">USB-C 별도 전원 동시 사용은 별도 검토</text><path d="M1145 615V660" fill="none" stroke="#d64b58" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-three)"/><rect x="940" y="660" width="415" height="125" rx="14" fill="#e9f8f3" stroke="#008775" stroke-width="1.6"/><text x="960" y="694" fill="#183148" font-size="21" font-weight="700">몸통 IMU / HAT 3.3V 계통</text><text x="960" y="724" fill="#536c80" font-size="17">HAT J7-2 → IMU 전원</text><text x="960" y="749" fill="#536c80" font-size="17">HAT J7-1 → IMU GND</text><text x="960" y="774" fill="#536c80" font-size="17">IMU는 배터리·서보 5V에 직접 연결하지 않음</text><path d="M860 180V385H790" fill="none" stroke="#c34b35" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-raw)"/><rect x="798" y="333" width="90" height="27" rx="5" fill="white"/><text x="805" y="352" fill="#c34b35" font-size="16" font-weight="700">F_SERVO</text><rect x="420" y="330" width="370" height="155" rx="14" fill="#fff7e9" stroke="#d08018" stroke-width="1.6"/><text x="440" y="364" fill="#183148" font-size="21" font-weight="700">서보 전용 강압기</text><text x="440" y="394" fill="#536c80" font-size="17">입력: 보호된 배터리 레일</text><text x="440" y="419" fill="#536c80" font-size="17">출력: 5.0V / 모델·용량 미확정</text><text x="440" y="444" fill="#536c80" font-size="17">서보 분기 차단 수단 포함</text><text x="440" y="469" fill="#536c80" font-size="17">회생·순간 부하·발열 검증</text><path d="M605 485V550" fill="none" stroke="#d08018" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-five)"/><rect x="420" y="550" width="370" height="150" rx="14" fill="#fff7e9" stroke="#d08018" stroke-width="1.6"/><text x="440" y="584" fill="#183148" font-size="21" font-weight="700">서보 5V 전원 분배</text><text x="440" y="614" fill="#536c80" font-size="17">오른쪽 다리 / 목·머리 / 왼쪽 다리</text><text x="440" y="639" fill="#536c80" font-size="17">각 그룹 전원·접지 별도 분기</text><text x="440" y="664" fill="#536c80" font-size="17">서보 3핀의 2번 = 이 5V</text><text x="440" y="689" fill="#536c80" font-size="17">HAT 모터 포트 2번과 연결 금지</text><rect x="45" y="365" width="285" height="170" rx="14" fill="#f4f8fd" stroke="#465769" stroke-width="1.6"/><text x="65" y="399" fill="#183148" font-size="21" font-weight="700">배터리 전압 감시</text><text x="65" y="429" fill="#536c80" font-size="17">측정 위치: 강압기 앞 배터리 측</text><text x="65" y="454" fill="#536c80" font-size="17">분압·ADC 등 인터페이스 필요</text><text x="65" y="479" fill="#536c80" font-size="17">회로·연결 핀은 아직 미정</text><text x="65" y="504" fill="#536c80" font-size="17">GPIO에 배터리 전압 직결 금지</text><path d="M370 180V420H330" fill="none" stroke="#465769" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7"/><circle cx="370" cy="180" r="6" fill="#c34b35"/><path d="M190 275V315H20V900H1145V785M605 700V900M925 190V900M940 190H925" fill="none" stroke="#465769" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="190" cy="900" r="6" fill="#465769"/><circle cx="605" cy="900" r="6" fill="#465769"/><circle cx="925" cy="900" r="6" fill="#465769"/><circle cx="1145" cy="900" r="6" fill="#465769"/><rect x="308" y="861" width="460" height="27" rx="5" fill="white"/><text x="315" y="880" fill="#465769" font-size="16" font-weight="700">배터리 − / 강압기 IN−·OUT− / HAT / 서보 / IMU 공통 GND</text><rect x="45" y="755" width="745" height="105" rx="14" fill="#fff1ee" stroke="#c34b35" stroke-width="1.6"/><text x="65" y="789" fill="#183148" font-size="21" font-weight="700">전원 하네스의 핵심</text><text x="65" y="819" fill="#536c80" font-size="17">HAT J13·J14의 2번은 +BATT 원전압이다. 서보용 5V와 이어 붙이지 않는다.</text><text x="45" y="952" fill="#465769" font-size="18">접지선: 도면은 공통 기준을 표시. 모터 귀환 전류는 전원 분배부로 굵고 짧게 연결한다.</text><path d="M42 1023H1358" fill="none" stroke="#465769" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="42" y="1054" fill="#536c80" font-size="16">전원 분리 설계안: 보호 부품 정격·강압기 모델·전선 굵기·전압 감시 회로는 선정 후 확정. HAT 입력 허용 범위와 서보 정격은 다르다.</text></svg>