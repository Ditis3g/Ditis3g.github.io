<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 870" role="img" aria-labelledby="title desc"><title id="title">03  J7 → 몸통 IMU · 4선 연결 상세</title><desc id="desc">J7 사용 경로 확정 / IMU 쪽은 선택한 완제품의 실제 핀 배열에 맞춰 연결</desc><defs><marker id="a-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2468b4"/></marker><marker id="a-imu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#008775"/></marker><marker id="a-raw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c34b35"/></marker><marker id="a-five" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#d08018"/></marker><marker id="a-gnd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#465769"/></marker><marker id="a-audio" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c51ac"/></marker><marker id="a-three" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#d64b58"/></marker></defs><style>text{font-family:"Malgun Gothic","Noto Sans KR",Arial,sans-serif} .t{font-size:21px;font-weight:700} .s{font-size:17px} .m{font-size:16px} .p{font-size:18px;font-weight:700}</style><rect width="1400" height="870" fill="white"/><text x="42" y="48" fill="#183148" font-size="30" font-weight="700">03  J7 → 몸통 IMU · 4선 연결 상세</text><text x="42" y="80" fill="#536c80" font-size="17">J7 사용 경로 확정 / IMU 쪽은 선택한 완제품의 실제 핀 배열에 맞춰 연결</text><rect x="45" y="150" width="370" height="115" rx="14" fill="#e9f8f3" stroke="#008775" stroke-width="1.6"/><text x="65" y="184" fill="#183148" font-size="21" font-weight="700">HAT C1 · J7 Unit</text><text x="65" y="214" fill="#536c80" font-size="17">JST SH 계열 / 1mm / 4핀</text><text x="65" y="239" fill="#536c80" font-size="17">회로·PCB상의 핀 번호 기준</text><rect x="940" y="150" width="415" height="115" rx="14" fill="#e9f8f3" stroke="#008775" stroke-width="1.6"/><text x="960" y="184" fill="#183148" font-size="21" font-weight="700">몸통 IMU 완제품</text><text x="960" y="214" fill="#536c80" font-size="17">제조사·모델명 비기재</text><text x="960" y="239" fill="#536c80" font-size="17">3.3V 전원·논리 / I²C 기능 기준</text><rect x="45" y="297" width="370" height="54" rx="9" fill="#f6f8fb" stroke="#465769"/><text x="65" y="332" fill="#465769" font-size="20" font-weight="700">J7-1  GND</text><rect x="940" y="297" width="415" height="54" rx="9" fill="#f6f8fb" stroke="#465769"/><text x="960" y="332" fill="#465769" font-size="20" font-weight="700">GND / 접지</text><path d="M415 325H940" fill="none" stroke="#465769" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><text x="470" y="312" fill="#465769" font-size="17">검정 / Qwiic 표준 색상</text><rect x="45" y="377" width="370" height="54" rx="9" fill="#f6f8fb" stroke="#d64b58"/><text x="65" y="412" fill="#d64b58" font-size="20" font-weight="700">J7-2  3.3V</text><rect x="940" y="377" width="415" height="54" rx="9" fill="#f6f8fb" stroke="#d64b58"/><text x="960" y="412" fill="#d64b58" font-size="20" font-weight="700">3.3V 전원 입력</text><path d="M415 405H940" fill="none" stroke="#d64b58" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><text x="470" y="392" fill="#d64b58" font-size="17">빨강 / 5V·배터리 입력 금지</text><rect x="45" y="457" width="370" height="54" rx="9" fill="#f6f8fb" stroke="#237aca"/><text x="65" y="492" fill="#237aca" font-size="20" font-weight="700">J7-3  SDA</text><rect x="940" y="457" width="415" height="54" rx="9" fill="#f6f8fb" stroke="#237aca"/><text x="960" y="492" fill="#237aca" font-size="20" font-weight="700">SDA / 데이터</text><path d="M415 485H940" fill="none" stroke="#237aca" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><text x="470" y="472" fill="#237aca" font-size="17">파랑 / 양방향 데이터</text><rect x="45" y="537" width="370" height="54" rx="9" fill="#f6f8fb" stroke="#ac8100"/><text x="65" y="572" fill="#ac8100" font-size="20" font-weight="700">J7-4  SCL</text><rect x="940" y="537" width="415" height="54" rx="9" fill="#f6f8fb" stroke="#ac8100"/><text x="960" y="572" fill="#ac8100" font-size="20" font-weight="700">SCL / 클록</text><path d="M415 565H940" fill="none" stroke="#ac8100" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><text x="470" y="552" fill="#ac8100" font-size="17">노랑 / Radxa가 클록 생성</text><text x="55" y="645" fill="#237aca" font-size="20" font-weight="700">J7-3 → HAT J4-24 → Radxa GPIO4_C6 → SDA</text><text x="55" y="682" fill="#ac8100" font-size="20" font-weight="700">J7-4 → HAT J4-21 → Radxa GPIO4_C5 → SCL</text><text x="55" y="727" fill="#183148" font-size="18">Radxa에서 위 핀을 GPIO-I²C로 설정. SPI·UART 등 다른 기능과 중복 점유하지 않는다.</text><text x="55" y="762" fill="#536c80" font-size="17">커넥터 정면·뒷면 그림이 아닌 기능 연결표. IMU의 핀 번호·케이블 방향은 제품 회로와 대조한다.</text><path d="M42 813H1358" fill="none" stroke="#465769" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="42" y="844" fill="#536c80" font-size="16">HAT J7 풀업: R34·R35 각 10kΩ. 모듈의 풀업과 병렬 합성·3.3V 레벨을 확인. 목 가동부 스트레인 릴리프와 통신 파형 점검.</text></svg>