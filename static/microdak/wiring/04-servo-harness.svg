<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc"><title id="title">04  TTL 모터 하네스 · DATA는 HAT, 전원은 서보 5V</title><desc id="desc">HAT 보드 원전압과 서보 강압 전원을 물리적으로 분리하는 어댑터 구성</desc><defs><marker id="a-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2468b4"/></marker><marker id="a-imu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#008775"/></marker><marker id="a-raw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c34b35"/></marker><marker id="a-five" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#d08018"/></marker><marker id="a-gnd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#465769"/></marker><marker id="a-audio" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c51ac"/></marker><marker id="a-three" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#d64b58"/></marker></defs><style>text{font-family:"Malgun Gothic","Noto Sans KR",Arial,sans-serif} .t{font-size:21px;font-weight:700} .s{font-size:17px} .m{font-size:16px} .p{font-size:18px;font-weight:700}</style><rect width="1400" height="1000" fill="white"/><text x="42" y="48" fill="#183148" font-size="30" font-weight="700">04  TTL 모터 하네스 · DATA는 HAT, 전원은 서보 5V</text><text x="42" y="80" fill="#536c80" font-size="17">HAT 보드 원전압과 서보 강압 전원을 물리적으로 분리하는 어댑터 구성</text><rect x="45" y="150" width="350" height="120" rx="14" fill="#f4f8fd" stroke="#2468b4" stroke-width="1.6"/><text x="65" y="184" fill="#183148" font-size="21" font-weight="700">HAT J13 또는 J14</text><text x="65" y="214" fill="#536c80" font-size="17">TTL 3핀 / JST EH 계열</text><text x="65" y="239" fill="#536c80" font-size="17">1=GND · 2=+BATT · 3=DATA</text><rect x="995" y="150" width="360" height="455" rx="14" fill="#f4f8fd" stroke="#2468b4" stroke-width="1.6"/><text x="1015" y="184" fill="#183148" font-size="21" font-weight="700">서보 측 3핀 연결</text><text x="1015" y="214" fill="#536c80" font-size="17">XL330-M288-T</text><text x="1015" y="239" fill="#536c80" font-size="17">1=GND · 2=5V · 3=DATA</text><text x="55" y="351" fill="#465769" font-size="21" font-weight="700">1  GND</text><path d="M205 345H395" fill="none" stroke="#465769" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="55" y="451" fill="#c34b35" font-size="21" font-weight="700">2  +BATT</text><path d="M205 445H395" fill="none" stroke="#c34b35" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="55" y="551" fill="#2468b4" font-size="21" font-weight="700">3  DATA</text><path d="M205 545H395" fill="none" stroke="#2468b4" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M395 345H995" fill="none" stroke="#465769" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="1035" y="352" fill="#465769" font-size="21" font-weight="700">1  GND</text><path d="M395 445H565" fill="none" stroke="#c34b35" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M565 430L590 460M590 430L565 460" fill="none" stroke="#c34b35" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="430" y="414" fill="#c34b35" font-size="18" font-weight="700">이 핀은 연결하지 않음</text><path d="M750 445H995" fill="none" stroke="#d08018" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><text x="1035" y="452" fill="#d08018" font-size="21" font-weight="700">2  5.0V</text><path d="M395 545H995" fill="none" stroke="#2468b4" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="1035" y="552" fill="#2468b4" font-size="21" font-weight="700">3  DATA</text><rect x="570" y="155" width="330" height="115" rx="14" fill="#fff7e9" stroke="#d08018" stroke-width="1.6"/><text x="590" y="189" fill="#183148" font-size="21" font-weight="700">별도 서보 5V 분배</text><text x="590" y="219" fill="#536c80" font-size="17">강압기 OUT+ = 5.0V</text><text x="590" y="244" fill="#536c80" font-size="17">OUT− = 공통 GND</text><path d="M750 270V332Q770 345 750 358V445" fill="none" stroke="#d08018" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="750" cy="445" r="6" fill="#d08018"/><path d="M615 270V345" fill="none" stroke="#465769" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="615" cy="345" r="6" fill="#465769"/><text x="465" y="595" fill="#183148" font-size="19" font-weight="700">별도 어댑터·분배 하네스에서 2번 전원을 교체한다.</text><path d="M1170 605V675H230M230 675V730M700 675V730M1170 675V730" fill="none" stroke="#2468b4" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="230" cy="675" r="6" fill="#2468b4"/><circle cx="700" cy="675" r="6" fill="#2468b4"/><circle cx="1170" cy="675" r="6" fill="#2468b4"/><rect x="473" y="642" width="240" height="27" rx="5" fill="white"/><text x="480" y="661" fill="#2468b4" font-size="16" font-weight="700">3개 그룹 / 통신은 하나의 TTL 버스</text><rect x="45" y="730" width="370" height="125" rx="14" fill="#f4f8fd" stroke="#2468b4" stroke-width="1.6"/><text x="65" y="764" fill="#183148" font-size="21" font-weight="700">오른쪽 다리</text><text x="65" y="794" fill="#536c80" font-size="17">10 → 11 → 12 → 13 → 14</text><text x="65" y="819" fill="#536c80" font-size="17">5개 모터 / 독립 전원·접지 분기</text><rect x="515" y="730" width="370" height="125" rx="14" fill="#f4f8fd" stroke="#2468b4" stroke-width="1.6"/><text x="535" y="764" fill="#183148" font-size="21" font-weight="700">목·머리·부리</text><text x="535" y="794" fill="#536c80" font-size="17">30 → 31 → 32 → 33 → 34</text><text x="535" y="819" fill="#536c80" font-size="17">5개 모터 / 독립 전원·접지 분기</text><rect x="985" y="730" width="370" height="125" rx="14" fill="#f4f8fd" stroke="#2468b4" stroke-width="1.6"/><text x="1005" y="764" fill="#183148" font-size="21" font-weight="700">왼쪽 다리</text><text x="1005" y="794" fill="#536c80" font-size="17">20 → 21 → 22 → 23 → 24</text><text x="1005" y="819" fill="#536c80" font-size="17">5개 모터 / 독립 전원·접지 분기</text><text x="45" y="907" fill="#536c80" font-size="18">분기 수·케이블 길이·전원 주입 위치는 실제 전류와 1Mbps 통신 파형을 보고 확정한다.</text><path d="M42 943H1358" fill="none" stroke="#465769" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="42" y="974" fill="#536c80" font-size="16">ID는 논리 식별자이며 물리 배선 순서를 강제하지 않는다. DATA 선에 별도 5V를 넣지 않는다. RS-485 J3·J11에는 XL330을 연결하지 않는다.</text></svg>